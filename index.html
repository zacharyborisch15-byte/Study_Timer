<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OMS-II · Study timer</title>
<style>
:root{color-scheme:light;--bg:#fff;--text:#37352f;--muted:#787774;--line:#e9e9e7;--soft:#f7f7f5;--accent:#447765;--button:#37352f;--inverse:#fff}
:root[data-theme=dark]{color-scheme:dark;--bg:#191919;--text:#e5e5e3;--muted:#a4a4a0;--line:#343434;--soft:#242424;--accent:#99bea9;--button:#e5e5e3;--inverse:#191919}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:540px;margin:auto;padding:24px}header,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:14px;font-weight:600;margin:0}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text);min-height:44px;padding:8px 14px}button:hover{background:var(--soft)}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);background:var(--soft)}.modes{display:flex;gap:8px;margin-top:25px}.modes button{flex:1}.clock{text-align:center;padding:24px 0 20px}#time{font-size:clamp(64px,17vw,100px);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.055em;line-height:1.2}.caption{color:var(--muted);font-size:13px}progress{display:block;width:100%;height:5px;border:0;border-radius:5px;overflow:hidden;accent-color:var(--accent);background:var(--soft)}progress::-webkit-progress-bar{background:var(--soft)}progress::-webkit-progress-value{background:var(--accent)}.controls{display:flex;gap:10px;margin:20px 0}.controls button{flex:1}#start{background:var(--button);color:var(--inverse);border-color:var(--button);font-weight:600}.settings{border-top:1px solid var(--line);padding-top:18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{font-size:12px;color:var(--muted)}input[type=number]{display:block;width:100%;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);padding:9px;margin:6px 0 8px}.presets{display:flex;gap:6px}.presets button{font-size:12px;padding:4px 12px;min-height:36px}.sound{display:flex;gap:8px;align-items:center;margin-top:18px;color:var(--text)}#status{min-height:40px;margin:18px 0 0;font-size:12px;color:var(--muted)}footer{font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:8px}@media(max-width:350px){main{padding:16px}.controls{gap:6px}button{padding:8px 10px}}
</style>
</head>
<body>
<main aria-label="Study timer">
<header><div><div class="eyebrow">OMS-II Command Center</div><h1>One block at a time.</h1></div><button id="theme" aria-label="Toggle dark mode">Dark mode</button></header>
<div class="modes" aria-label="Timer mode"><button data-mode="focus" aria-pressed="true">Focus</button><button data-mode="break" aria-pressed="false">Break</button></div>
<div class="clock"><div id="time" role="timer" aria-label="Time remaining">60:00</div><div class="caption" id="phase">Anki · study block</div></div>
<progress id="progress" value="0" max="1" aria-label="Block progress"></progress>
<div class="controls"><button id="start">Start</button><button id="reset">Reset</button><button id="next">Go to break</button></div>
<section class="settings" aria-label="Interval settings"><div class="fields"><div><label for="focus">Focus · minutes</label><input id="focus" type="number" min="1" max="360" step="1" value="60"><div class="presets"><button data-for="focus" data-minutes="60">60 min</button><button data-for="focus" data-minutes="90">90 min</button></div></div><div><label for="break">Break · minutes</label><input id="break" type="number" min="1" max="360" step="1" value="20"><div class="presets"><button data-for="break" data-minutes="20">20 min</button><button data-for="break" data-minutes="30">30 min</button></div></div></div><label class="sound"><input type="checkbox" id="sound" checked> Sound when a block ends</label></section>
<p id="status" role="status" aria-live="polite">Choose your interval, then start. Each block starts manually.</p>
<footer>Keep this page open for the end chime. Settings stay on this browser when storage is available.</footer>
</main>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const key = 'oms-study-timer-v1';
let mode = 'focus', remaining = 3600000, duration = remaining, end = null, audio;
const intervals = {focus:60, break:20};
let theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
// Storage may be unavailable in an embedded browser. The timer still works.
try {
 const saved = JSON.parse(localStorage.getItem(key) || 'null');
 if (saved) {
  for (const name of ['focus','break']) if (Number.isInteger(saved[name]) && saved[name]>=1 && saved[name]<=360) $(name).value=saved[name];
  if (['dark','light'].includes(saved.theme)) theme=saved.theme;
  if (typeof saved.sound==='boolean') $('sound').checked=saved.sound;
 }
} catch {}
for (const name of ['focus','break']) intervals[name]=+$(name).value;
function save(){try{localStorage.setItem(key,JSON.stringify({focus:+$('focus').value,break:+$('break').value,theme,sound:$('sound').checked}));}catch{}}
function applyTheme(){document.documentElement.dataset.theme=theme;$('theme').textContent=theme==='dark'?'Light mode':'Dark mode';$('theme').setAttribute('aria-pressed',String(theme==='dark'));}
function render(){
 const seconds=Math.ceil(remaining/1000);
 $('time').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
 $('progress').value=Math.max(0,Math.min(1,1-remaining/duration));
 $('start').textContent=end!==null?'Pause':remaining===0?'Restart':'Start';
 $('phase').textContent=mode==='focus'?'Anki · study block':'Rest · recharge';
 $('next').textContent=mode==='focus'?'Go to break':'Go to focus';
 document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));
 document.querySelectorAll('[data-minutes]').forEach(b=>b.setAttribute('aria-pressed',String(+$(b.dataset.for).value===+b.dataset.minutes)));
 document.title=$('time').textContent+' · '+(mode==='focus'?'Focus':'Break');
}
function reset(){end=null;duration=intervals[mode]*60000;remaining=duration;render();}
function select(next){mode=next;reset();$('status').textContent=mode==='focus'?'Ready for your next study block.':'Take a breather. Start your break when ready.';}
function unlockAudio(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{});}catch{}}
function chime(){if(!$('sound').checked||!audio||audio.state!=='running')return;try{[0,.3,.6].forEach((delay,i)=>{const osc=audio.createOscillator(),gain=audio.createGain(),t=audio.currentTime+delay;osc.frequency.value=i===2?880:660;gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(.18,t+.02);gain.gain.exponentialRampToValueAtTime(.001,t+.25);osc.connect(gain);gain.connect(audio.destination);osc.start(t);osc.stop(t+.26);});}catch{}}
// A deadline, rather than counting callbacks, prevents background-tab drift.
function tick(){if(end===null)return;remaining=Math.max(0,end-Date.now());if(remaining===0){end=null;chime();$('status').textContent=mode==='focus'?'Focus complete. Switch to your break when ready.':'Break complete. Switch to focus when ready.';}render();}
$('start').onclick=()=>{unlockAudio();if(end!==null){tick();end=null;}else{if(remaining===0)reset();end=Date.now()+remaining;$('status').textContent=mode==='focus'?'Focus in progress. You’ve got this.':'Break in progress. Let yourself recharge.';}render();};
$('reset').onclick=()=>{reset();$('status').textContent='Block reset. Start when ready.';};
$('next').onclick=()=>select(mode==='focus'?'break':'focus');
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>select(b.dataset.mode));
function update(name){const input=$(name);if(!input.checkValidity()||!Number.isInteger(+input.value)){input.reportValidity();input.value=intervals[name];return;}intervals[name]=+input.value;save();if(mode===name){reset();$('status').textContent='Interval updated. Start when ready.';}render();}
for(const name of ['focus','break'])$(name).onchange=()=>update(name);
document.querySelectorAll('[data-minutes]').forEach(b=>b.onclick=()=>{$(b.dataset.for).value=b.dataset.minutes;update(b.dataset.for);});
$('theme').onclick=()=>{theme=theme==='dark'?'light':'dark';applyTheme();save();};
$('sound').onchange=()=>{if($('sound').checked)unlockAudio();save();};
document.addEventListener('visibilitychange',tick);window.addEventListener('focus',tick);
applyTheme();reset();setInterval(tick,250);
})();
</script>
</body>
</html>
